# ==============================================================================
# RetailPulse: dbt Project Configuration
# File: dbt/retailpulse_dbt/dbt_project.yml
# ==============================================================================

name: 'retailpulse_dbt'
version: '1.0.0'
config-version: 2

# Connects to the profile named 'retailpulse' located in ~/.dbt/profiles.yml
profile: 'retailpulse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Materialization strategy:
# Staging models are built as lightweight views.
# Mart models (analytics data marts) are materialized as persistent tables.
models:
  retailpulse_dbt:
    staging:
      +materialized: view
    marts:
      +materialized: table
